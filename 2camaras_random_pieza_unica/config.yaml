    - 0.0
    - 1.0
    color_hex: '#000000'
    roughness: 1.0
    purpose: 'Fondo negro para camara lateral: piezas resaltan en silueta'

cameras:
  common:
    type: PERSP
    focal_length_mm: 27.0
    clip_start: 0.01
    clip_end: 100.0
    target:
    - 0.0
    - 0.0
    - 0.0
    track_axis: TRACK_NEGATIVE_Z
    up_axis: UP_Y
  cenital:
    position:
    - 0.0
    - 0.0
    - 15.0
    pitch_deg: 90.0
    scale_px_per_mm: 3.2
    role: dinov2_visual_similarity + oriented_size_2d
    dinov2_enabled: true
  lateral:
    position:
    - 15.0
    - 0.0
    - 2.5
    pitch_deg: 0.0
    scale_px_per_mm: 3.2
    role: height_profile_verification + dinov2_visual_similarity
    dinov2_enabled: true

render:
  engine: BLENDER_EEVEE
  resolution:
    width: 640
    height: 640
  eevee:
    taa_render_samples: 16
  cycles:
    samples_dataset: 4
    samples_ref: 8
    samples_final: 64
  film_transparent: false
  gpu_acceleration: METAL

