yolo:
  dataset:
    pieces_per_frame: 1
    empty_frame_ratio: 0.05
    train_val_split: 0.7
    total_pieces_cenital: 5000
    total_pieces_lateral: 3000
    classes:
      0: lego_piece
  training:
    model_base: yolo11n.pt
    epochs: 15
    batch_size: 16
    image_size: 640
    device: mps
    amp: true
    workers: 2
    cache: true
    patience: 15
    delta_improvement: 0.001
    augmentation:
      hsv_h: 0.015
      hsv_s: 0.7
      hsv_v: 0.4
      degrees: 360.0
      flip_lr: 0.5
      flip_ud: 0.5
  weights:
    cenital: models/yolo_cenital.pt
    lateral: models/yolo_lateral.pt
dinov2:
  model:
    name: dinov2_vits14
    source: facebookresearch/dinov2
    embedding_dim: 384
    device: mps
  preprocessing:
    canvas_size: 224
    canvas_margin_px: 8
    canvas_bg_color:
    - 37
    - 65
    - 84
    transform:
      resize: 256
      center_crop: 224
      normalize_mean:
      - 0.485
      - 0.456
      - 0.406
      normalize_std:
      - 0.229
      - 0.224
      - 0.225
  projection_head:
    type: multimodal
    input_dim: 386
    hidden_dim: 512
    output_dim: 128
    activation: ReLU
    normalization: LayerNorm
    output_normalize: L2
    weights_path: models/dino_multimodal_head.pt
    unimodal_weights_path: models/dino_metric_head.pt
  reference_generation:
    script: scripts/generate_eevee_dinov2_refs.py
    output_dir: data/dinov2_refs
    cameras:
    - cenital
    - lateral
    rotations_per_pose: 12
    rotation_step_deg: 30
  indexing:
    script: scripts/reindex_dinov2_eevee.py
    table: piece_embeddings
    cameras_to_index:
    - cenital
    - lateral
    cenital_cam_id: 1
    lateral_cam_id: 2
    batch_size: 128
    clear_before_index: true
    store_raw_embedding: true
    store_projected_embedding: true
stable_poses:
  cache_path: data/stable_poses_cache.json
  tarps_min_tipping: 0.04
  render_min_stability: 0.01
  min_contact_dimension_mm: 4.0
inference:
  evaluation_script: scripts/run_evaluation.py
  report_output: data/eval_report.json
  calibration:
    px_per_mm_cenital: 10.4296288
    px_per_mm_lateral: 10.24
    camera_dist_mm: 300.0
  segmentation:
    method: chromaticity
    black_bg_threshold: 5
    bg_corner_dark_thresh: 15
    chromaticity_dist_thresh: 0.04
    luminance_min_thresh: 30
    morphology_kernel_size: 7
    morphology_close_iterations: 2
    morphology_open_iterations: 1
    min_contour_area: 50
  query_canvas:
    size: 224
    scale_factor: 0.325
    bg_color:
    - 0
    - 0
    - 0
  size_scoring:
    sigma_mm: 5.0
    hybrid_threshold_mm2: 150.0
    abs_tolerance_mm2: 35.0
    rel_tolerance_pct: 20.0
  color_calibration:
    ccm_cenital:
    - [ 0.77034800, 0.05751623, 0.16801945 ]
    - [ 0.20230499, 0.64920836, 0.16135712 ]
    - [ 0.20267209, 0.06575232, 0.74532955 ]
    ccm_lateral:
    - [ 0.68861177, 0.12787984, 0.23842127 ]
    - [ 0.30811314, 0.52769674, 0.22694172 ]
    - [ 0.32680402, 0.10970321, 0.62782480 ]
database:
  provider: supabase
  embeddings_table: piece_embeddings
sets:
  all_set_ids:
  - 75078-1
  default_set_id: 75078-1
logging:
  enabled: true
  dir: logs
  level: INFO
  max_file_size_mb: 50
  max_files: 10
  blender:
    file: blender_{date}.log
    level: INFO
  dinov2:
    file: dinov2_{date}.log
    level: INFO
  pipeline:
    file: pipeline_{date}.log
    level: DEBUG
  yolo:
    file: yolo_{date}.log
    level: INFO
