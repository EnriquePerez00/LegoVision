services:
  # ============================================================
  # PostgreSQL — puerto 5434 (evita conflicto con otras DBs)
  # ============================================================
  legvision-db:
    image: postgres:16-alpine
    container_name: legvision-postgres
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: legvision
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: legvision_pass_2024
    volumes:
      - legvision_pgdata:/var/lib/postgresql/data
      - ./core/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d legvision"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # PostgREST — API REST automática sobre PostgreSQL
  # Puerto 5437 (evita conflicto con otros PostgREST)
  # ============================================================
  legvision-api:
    image: postgrest/postgrest:v12.2.0
    container_name: legvision-postgrest
    restart: unless-stopped
    ports:
      - "5437:3000"
    environment:
      PGRST_DB_URI: postgres://postgres:legvision_pass_2024@legvision-db:5432/legvision
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: postgres
      PGRST_OPENAPI_SERVER_PROXY_URI: http://localhost:5437
      PGRST_LOG_LEVEL: info
    depends_on:
      legvision-db:
        condition: service_healthy

  # ============================================================
  # Swagger UI — Documentación interactiva de la API REST
  # Puerto 5438
  # ============================================================
  legvision-swagger:
    image: swaggerapi/swagger-ui:latest
    container_name: legvision-swagger
    restart: unless-stopped
    ports:
      - "5438:8080"
    environment:
      API_URL: http://localhost:5437/

volumes:
  legvision_pgdata:
    name: legvision_pgdata
