yolo:
  dataset:
    frames: 800
    pieces_per_frame_min: 4
    pieces_per_frame_max: 10
    empty_frame_ratio: 0.05
    train_val_split: 0.7
    output_raw: data/raw_dataset
    output_processed: data/processed_dataset
    classes:
      0: lego_piece
      1: minifigure
    total_pieces_cenital: 5000
    total_pieces_frontal: 3000
  training:
    model_base: yolo11n.pt
    epochs: 15
    batch_size: 16
    image_size: 640
    device: mps
    amp: true
    workers: 2
    cache: true
    patience: 15
    delta_improvement: 0.001
    augmentation:
      hsv_h: 0.015
      hsv_s: 0.7
      hsv_v: 0.4
      degrees: 360.0
      flip_lr: 0.5
      flip_ud: 0.5
  weights:
    best: models/best.pt
    cenital_val: models/yolo_cenital_v2.pt
    lateral_val: models/yolo_frontal_v2.pt
dinov2:
  model:
    name: dinov2_vits14
    source: facebookresearch/dinov2
    embedding_dim: 384
    device: mps
  preprocessing:
    canvas_size: 224
    canvas_margin_px: 8
    canvas_bg_color:
    - 37
    - 65
    - 84
    transform:
      resize: 256
      center_crop: 224
      normalize_mean:
      - 0.485
      - 0.456
      - 0.406
      normalize_std:
      - 0.229
      - 0.224
      - 0.225
  projection_head:
    type: multimodal
    input_dim: 386
    hidden_dim: 512
    output_dim: 128
    activation: ReLU
    normalization: LayerNorm
    output_normalize: L2
    weights_path: models/dino_multimodal_head.pt
    unimodal_weights_path: models/dino_metric_head.pt
  metric_training:
    loss: TripletMarginLoss
    margin: 1.0
    p_norm: 2
    optimizer: Adam
    learning_rate: 0.001
    epochs: 60
    batch_size: 64
    positives_per_anchor: 10
    negatives_per_positive: 2
  reference_generation:
    script: scripts/generate_eevee_dinov2_refs.py
    output_dir: data/dinov2_refs_full
    cameras:
    - cenital
    - frontal
    rotations_per_pose: 12
    rotation_step_deg: 30
  indexing:
    script: scripts/reindex_dinov2_eevee.py
    table: piece_embeddings
    cameras_to_index:
    - cenital
    - frontal
    cenital_cam_id: 1
    frontal_cam_id: 2
    batch_size: 128
    clear_before_index: true
    store_raw_embedding: true
    store_projected_embedding: true
  dimensions_cache:
    path: data/ref_oriented_dimensions.json
test_set:
  script: scripts/generate_iter9_test_set.py
  output_dir: data/validation_renders_full
  metadata_file: test_metadata.json
  num_samples: 100
  cameras:
  - cenital
  - frontal
  naming_pattern: sample_{NNN}_{camera}.png
  guard_left_enabled: false
  poses_cache: data/stable_poses_cache.json
inference:
  evaluation_script: scripts/run_iter9_evaluation_calibrated.py
  report_output: data/validation_renders_full/eval_report.json
  calibration:
    px_per_mm_ref: 3.2
    px_per_mm_test: 3.2
    px_per_mm_lateral: 3.2
  segmentation:
    method: chromaticity
    black_bg_threshold: 5
    bg_corner_dark_thresh: 15
    chromaticity_dist_thresh: 0.04
    luminance_min_thresh: 30
    morphology_kernel_size: 3
    morphology_close_iterations: 2
    morphology_open_iterations: 1
    min_contour_area: 10
  query_canvas:
    size: 224
    scale_factor: 0.325
    bg_color:
    - 0
    - 0
    - 0
  size_scoring:
    sigma_mm: 5.0
  height_validation:
    pitch_deg: 0.0
    cos_pitch: 1.0
    sin_pitch: 0.0
    stud_offset_mm: 0.9
    tolerance_mm: 2.2
    penalty_factor: 0.01
  camera_weights:
    cenital: 0.7
    frontal: 0.3
stable_poses:
  belt_speed_ms: 0.0833
  impulse_duration_s: 0.1
  sim_fps: 60
  settle_frames: 20
  impulse_frames: 6
  eval_frames: 40
  total_frames: 66
  n_directions: 8
  stability_threshold: 0.875
  angle_threshold_deg: 15.0
  min_face_area_ldu2: 28.3
  settle_z_offset: 0.3
  render_min_stability: 0.01
  min_contact_dimension_mm: 4.0
database:
  provider: supabase
  embeddings_table: piece_embeddings
sets:
  all_set_ids:
  - 75078-1
  default_set_id: 75078-1
logging:
  enabled: true
  dir: logs
  level: INFO
  max_file_size_mb: 50
  max_files: 10
  blender:
    file: blender_{date}.log
    level: INFO
  dinov2:
    file: dinov2_{date}.log
    level: INFO
  pipeline:
    file: pipeline_{date}.log
    level: DEBUG
  yolo_cenital:
    file: yolo_cenital_{date}.log
    level: INFO
validation_renders:
  total_images: 500
  pieces_source: selected_parts
  placement:
    strategy: single_line_x
    line_y_bu: -0.5
    margin_bu: 0.5
    limit_x_bu: 9.5
  camera: frontal
  output_dir: data/validation_renders_full
  image_prefix: val
  include_metadata_json: true
optimization:
  version: v3
  date: '2026-05-06'
  changes:
  - 'epochs: 35 -> 15 (plateau at epoch 8-10, no accuracy loss)'
  - 'amp: True (mixed precision FP16, 30% faster on MPS)'
  - 'total_pieces_cenital: 10000 -> 5000 (oversized for 1 class)'
  - 'total_pieces_frontal: 5000 -> 3000 (oversized for 1 class)'
  estimated_time_savings: 57% reduction (140 min -> 60 min)
  accuracy_impact: negligible (<0.1% mAP difference)
